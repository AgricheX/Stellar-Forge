<!doctype html>
<html lang="en" data-theme="nexus" data-mode="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0d0d0f" />
		<meta
			name="description"
			content="Stellar Forge: paint, generate and fine-tune custom Stellaris galaxies in your browser, then export a ready-to-use mod."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Agriche · Stellar Forge" />
		<meta
			property="og:url"
			content="https://agrichex.github.io/Stellar-Forge/"
		/>
		<meta
			property="og:title"
			content="Stellar Forge · Stellaris galaxy maker"
		/>
		<meta
			property="og:description"
			content="Paint, type or roll a Stellaris galaxy: shapes, text and emoji, layers, fiction presets and a ready-to-play mod. Free, in your browser."
		/>
		<meta
			property="og:image"
			content="https://agrichex.github.io/Stellar-Forge/og.png"
		/>
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta
			name="twitter:image"
			content="https://agrichex.github.io/Stellar-Forge/og.png"
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/logo.svg" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/icons/favicon-32.png"
		/>
		<link
			rel="apple-touch-icon"
			href="%sveltekit.assets%/icons/apple-touch-icon.png"
		/>
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;900&family=Press+Start+2P&family=Russo+One&display=swap"
			rel="stylesheet"
		/>
		<script>
			if (localStorage.getItem('stellar-forge-mode') === 'light') {
				document.documentElement.dataset.mode = 'light';
			}
		</script>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		data-theme="nexus"
		class="h-screen w-screen"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
